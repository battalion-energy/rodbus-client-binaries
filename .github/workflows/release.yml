name: Build rodbus-client

on:
  push:
    branches: [main]

  # Check upstream once a week
  schedule:
    - cron: '23 13 * * 1'

permissions:
  contents: write

jobs:
  check_release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      tag: ${{ steps.upstream.outputs.tag }}
      should_build: ${{ steps.local_release.outputs.should_build }}

    steps:
      - id: upstream
        name: Get latest upstream release
        run: |
          tag="$(gh api repos/stepfunc/rodbus/releases/latest --jq '.tag_name')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - id: local_release
        name: Check whether it is already published
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build_binary:
    needs: check_release
    if: needs.check_release.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-musl
          - x86_64-unknown-linux-musl

    steps:
      - uses: actions-rust-lang/setup-rust-toolchain@v1.10.1
        with:
          cache: false

      - name: Install Cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross@0.2.5

      - name: Clone upstream
        run: |
            git clone --depth 1 \
            --branch "${{ needs.check_release.outputs.tag }}" \
            https://github.com/stepfunc/rodbus.git rodbus-upstream

      - name: Build rodbus-client
        working-directory: rodbus-upstream
        run: |
          cross build \
            --locked \
            --release \
            --target "${{ matrix.target }}" \
            --package rodbus-client

      - name: Upload binary
        uses: actions/upload-artifact@v7 
        with:
          name: rodbus-client-${{ matrix.target }}
          path: rodbus-upstream/target/${{ matrix.target }}/release/rodbus-client

  package_archive:
    needs: [check_release, build_binary]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-musl
          - x86_64-unknown-linux-musl

    steps:
      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: rodbus-client-${{ matrix.target }}
          path: artifact

      - name: Create release archive
      # break up please  
        run: tar -C artifact -czf rodbus-client-${{ needs.check_release.outputs.tag }}-${{ matrix.target }}.tar.gz rodbus-client

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: rodbus-client-${{ matrix.target }}-archive
          path: rodbus-client-${{ needs.check_release.outputs.tag }}-${{ matrix.target }}.tar.gz

  create_release:
    needs: [check_release, package_archive]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.check_release.outputs.tag }}

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: rodbus-client-*-archive
          path: dist
          merge-multiple: true

      - name: Create checksum manifest
        run: sha256sum dist/*.tar.gz > dist/SHA256SUMS

      - name: Create GitHub Release
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "rodbus-client $TAG" \
            --generate-notes
